<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f13a22">
    <meta name="description" content="Tarjeta de contacto de Cesar Campos Arvelo, Vendedor en Fudo.">
    <title>Cesar Campos Arvelo | Fudo</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Fudo">
    <meta property="og:title" content="Cesar Campos Arvelo | Vendedor en Fudo">
    <meta property="og:description" content="Conoce a Cesar Campos Arvelo, Vendedor en Fudo.">
    <meta property="og:url" content="https://irustub.github.io/">
    <meta property="og:image" content="https://irustub.github.io/social-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Tarjeta de contacto de Cesar Campos Arvelo, Vendedor en Fudo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cesar Campos Arvelo | Vendedor en Fudo">
    <meta name="twitter:description" content="Conoce a Cesar Campos Arvelo, Vendedor en Fudo.">
    <meta name="twitter:image" content="https://irustub.github.io/social-preview.png">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #202b27;
            background: #f4f2ed;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --ink: #202b27;
            --muted: #66736d;
            --green: #c8321e;
            --line: #e5e9e4;
        }

        * {
            box-sizing: border-box;
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 10%, rgba(190, 214, 194, .48), transparent 34rem),
                radial-gradient(ellipse at 92% 88%, rgba(231, 215, 184, .38), transparent 30rem),
                #f4f2ed;
        }

        a {
            color: inherit;
        }

        .card {
            width: min(100%, 460px);
            overflow: hidden;
            border: 1px solid rgba(32, 43, 39, .08);
            border-radius: 26px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 24px 70px rgba(42, 54, 47, .12);
            animation: card-enter .55s cubic-bezier(.2, .7, .2, 1) both;
        }

        .card-header {
            line-height: 0;
        }

        .brand-banner {
            width: 100%;
            height: auto;
            display: block;
        }

        .card-content {
            padding: 28px 30px 30px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--green);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .identity-text {
            min-width: 0;
        }

        .avatar {
            position: relative;
            width: 84px;
            height: 84px;
            flex: none;
            overflow: hidden;
            border: 3px solid #fff;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(135deg, #f13a22, #c8321e);
            box-shadow: 0 0 0 2px #f13a22, 0 8px 20px rgba(241, 58, 34, .25);
            display: grid;
            place-items: center;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 28px;
        }

        .avatar img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar img[hidden] {
            display: none;
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 7vw, 36px);
            font-weight: 500;
            letter-spacing: -.035em;
            line-height: 1.12;
            overflow-wrap: anywhere;
        }

        .role {
            margin: 14px 0 0;
            padding: 7px 16px 7px 14px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, #f13a22, #c8321e);
            box-shadow: 0 6px 16px rgba(241, 58, 34, .28);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .role::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            content: "";
        }

        .actions {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button {
            min-height: 48px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--green);
            border-radius: 12px;
            color: #fff;
            background: var(--green);
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background .18s ease, transform .18s ease;
            cursor: pointer;
        }

        .button:hover {
            background: #1d5943;
            transform: translateY(-1px);
        }

        .button.secondary {
            color: var(--green);
            background: #fff;
        }

        .button.whatsapp {
            grid-column: 1 / -1;
            border-color: #218c55;
            background: #218c55;
        }

        .button.whatsapp:hover {
            background: #197344;
        }

        .button[hidden] {
            display: none;
        }

        .button.whatsapp svg {
            width: 19px;
            height: 19px;
            margin-right: 8px;
            fill: currentColor;
        }

        .button.secondary:hover {
            background: #f1f7f2;
        }

        .section-title {
            margin: 29px 0 11px;
            color: #87918b;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .details {
            margin: 0;
            border-top: 1px solid var(--line);
        }

        .detail {
            min-height: 52px;
            padding: 12px 0;
            display: grid;
            grid-template-columns: 94px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }

        .detail dt {
            color: var(--muted);
        }

        .detail dd {
            min-width: 0;
            margin: 0;
            color: var(--ink);
            font-weight: 550;
            overflow-wrap: anywhere;
        }

        .detail a {
            color: var(--green);
            text-decoration-color: rgba(36, 107, 82, .35);
            text-underline-offset: 3px;
        }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .social-link {
            min-height: 34px;
            padding: 7px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--green);
            background: #fbfcfa;
            font-size: 12px;
            font-weight: 650;
            text-decoration: none;
        }

        .social-link:hover {
            border-color: #b8d1c1;
            background: #f1f7f2;
        }

        .note {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .footer {
            padding: 0 30px 24px;
            color: #929b95;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 380px) {
            body {
                padding: 14px 10px;
            }

            .card-content {
                padding: 24px;
            }

            .detail {
                grid-template-columns: 78px minmax(0, 1fr);
            }

            .footer {
                padding-right: 24px;
                padding-left: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="full-name">
        <div class="card-header">
            <img class="brand-banner" src="fudo-banner.png" alt="Logotipo de Fudo sobre fondo naranja">
        </div>

        <section class="card-content">
            <p class="eyebrow">Tarjeta de contacto · Fudo</p>
            <div class="identity">
                <div class="avatar" id="avatar">
                    <img id="avatar-photo" src="foto-cesar.jpg" alt="Rostro de Cesar Campos Arvelo">
                    <span id="avatar-initials" aria-hidden="true"></span>
                </div>
                <div class="identity-text">
                    <h1 id="full-name"></h1>
                    <p class="role" id="role"></p>
                </div>
            </div>

            <div class="actions">
                <a class="button" id="email-button">Enviar correo</a>
                <a class="button secondary" id="phone-button">Llamar</a>
                <a class="button whatsapp" id="whatsapp-button" target="_blank" rel="noopener noreferrer" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.93 9.93 0 0 0-8.51 15.05L2.2 21.8l4.87-1.28A9.93 9.93 0 1 0 12.04 2Zm0 18.05a8.1 8.1 0 0 1-4.13-1.13l-.3-.18-2.89.76.77-2.81-.2-.3A8.12 8.12 0 1 1 12.04 20.05Zm4.45-6.08c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.95-1.21-.72-.64-1.21-1.43-1.35-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.77-.2-.46-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.09 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"/></svg>
                    Escribir por WhatsApp
                </a>
                <button class="button secondary" id="save-contact" type="button" style="grid-column: 1 / -1">Guardar contacto</button>
            </div>

            <h2 class="section-title">Datos de contacto</h2>
            <dl class="details" id="contact-details"></dl>

            <h2 class="section-title" id="social-title">Redes sociales</h2>
            <div class="social-links" id="social-links"></div>
            <p class="note" id="note" hidden></p>
        </section>
        <footer class="footer">Cesar Campos Arvelo · Fudo</footer>
    </main>

    <script>
        const profile = {
            firstName: "Cesar",
            lastName: "Campos Arvelo",
            company: "Fudo",
            role: "Vendedor",
            email: "Ecampos@fu.do",
            phone: "+56 9 7718 5379",
            whatsappPhone: "+56 9 7718 5379",
            website: "https://fu.do/es-cl/",
            address: {
                street: "",
                city: "Santiago",
                region: "Región Metropolitana",
                postalCode: "",
                country: "Chile"
            },
            note: "Aquí puedes agregar una breve descripción, especialidad o mensaje.",
            whatsappMessage: "Hola, vi tu tarjeta de contacto y me gustaría ponerme en contacto contigo.",
            socialProfiles: [
                { name: "YouTube", type: "youtube", url: "https://www.youtube.com/@socialfudo" },
                { name: "Instagram", type: "instagram", url: "https://www.instagram.com/socialfudo?xtok=bmg4d3ltYzQzNWtq" },
                { name: "Facebook", type: "facebook", url: "https://www.facebook.com/socialfudo/" }
            ]
        };

        const fullName = [profile.firstName, profile.lastName].filter(Boolean).join(" ").trim();
        const fullNameElement = document.querySelector("#full-name");
        const detailsElement = document.querySelector("#contact-details");
        const socialLinksElement = document.querySelector("#social-links");

        fullNameElement.textContent = fullName || "Tu nombre completo";
        const avatarPhoto = document.querySelector("#avatar-photo");
        document.querySelector("#avatar-initials").textContent = [profile.firstName, profile.lastName]
            .map((part) => part.trim()[0] || "")
            .join("")
            .toUpperCase();
        avatarPhoto.addEventListener("error", () => { avatarPhoto.hidden = true; });
        if (avatarPhoto.complete && avatarPhoto.naturalWidth === 0) avatarPhoto.hidden = true;
        document.querySelector("#role").textContent = profile.role;
        const noteElement = document.querySelector("#note");
        noteElement.textContent = profile.note;
        noteElement.hidden = !profile.note;

        const emailButton = document.querySelector("#email-button");
        emailButton.hidden = !profile.email;
        if (profile.email) emailButton.href = `mailto:${profile.email}`;
        const phoneButton = document.querySelector("#phone-button");
        phoneButton.hidden = !profile.phone;
        if (profile.phone) phoneButton.href = `tel:${profile.phone.replace(/[^\d+]/g, "")}`;
        const whatsappButton = document.querySelector("#whatsapp-button");
        function configureWhatsAppButton(phone, message) {
            whatsappButton.hidden = true;
            if (!phone) return;
            const whatsappNumber = phone.replace(/\D/g, "");
            if (whatsappNumber.length < 8 || whatsappNumber.length > 15) return;

            whatsappButton.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
            whatsappButton.hidden = false;
        }
        configureWhatsAppButton(profile.whatsappPhone, profile.whatsappMessage);

        function addDetail(label, value, href) {
            if (!value) return;

            const row = document.createElement("div");
            row.className = "detail";
            const term = document.createElement("dt");
            term.textContent = label;
            const description = document.createElement("dd");

            if (href) {
                const link = document.createElement("a");
                link.href = href;
                link.textContent = value;
                if (href.startsWith("http")) {
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                }
                description.append(link);
            } else {
                description.textContent = value;
            }

            row.append(term, description);
            detailsElement.append(row);
        }

        if (profile.email) addDetail("Correo", profile.email, `mailto:${profile.email}`);
        if (profile.phone) addDetail("Teléfono", profile.phone, `tel:${profile.phone.replace(/[^\d+]/g, "")}`);
        addDetail("Sitio web", profile.website, profile.website);

        const address = [
            profile.address.country || "",
            profile.address.region || "",
            profile.address.city || "",
            profile.address.postalCode || "",
            profile.address.street || ""
        ].filter(Boolean).join(", ");
        addDetail("Ubicación", address);

        profile.socialProfiles.filter((social) => social.url).forEach((social) => {
            const link = document.createElement("a");
            link.className = "social-link";
            link.href = social.url;
            link.textContent = social.name;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            socialLinksElement.append(link);
        });
        if (socialLinksElement.childElementCount === 0) {
            document.querySelector("#social-title").hidden = true;
        }

        function escapeVCard(value) {
            return String(value || "")
                .replace(/\\/g, "\\\\")
                .replace(/\r?\n/g, "\\n")
                .replace(/,/g, "\\,")
                .replace(/;/g, "\\;");
        }

        document.querySelector("#save-contact").addEventListener("click", () => {
            const lines = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:${escapeVCard(profile.lastName)};${escapeVCard(profile.firstName)};;;`,
                `FN:${escapeVCard(fullName)}`,
                `ORG:${escapeVCard(profile.company)}`,
                `TITLE:${escapeVCard(profile.role)}`,
                ...(profile.phone ? [`TEL;TYPE=CELL:${escapeVCard(profile.phone)}`] : []),
                ...(profile.email ? [`EMAIL;TYPE=INTERNET:${escapeVCard(profile.email)}`] : [])
            ];

            if (profile.website) lines.push(`URL:${escapeVCard(profile.website)}`);
            if (address) {
                lines.push(`ADR;TYPE=WORK:;;${escapeVCard(profile.address.street)};${escapeVCard(profile.address.city)};${escapeVCard(profile.address.region)};${escapeVCard(profile.address.postalCode)};${escapeVCard(profile.address.country)}`);
            }
            profile.socialProfiles.filter((social) => social.url).forEach((social) => {
                lines.push(`X-SOCIALPROFILE;TYPE=${escapeVCard(social.type)}:${escapeVCard(social.url)}`);
            });
            if (profile.note) lines.push(`NOTE:${escapeVCard(profile.note)}`);
            lines.push("END:VCARD");

            const file = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
            const downloadUrl = URL.createObjectURL(file);
            const downloadLink = document.createElement("a");
            downloadLink.href = downloadUrl;
            downloadLink.download = `${fullName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "contacto"}.vcf`;
            downloadLink.click();
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        });
    </script>
</body>
</html>
