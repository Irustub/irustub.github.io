<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f2ed">
    <meta name="description" content="Tarjeta de contacto digital. Guarda mis datos y encuentra mis redes sociales.">
    <title>Tarjeta de contacto</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #202b27;
            background: #f4f2ed;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --ink: #202b27;
            --muted: #66736d;
            --green: #246b52;
            --line: #e5e9e4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 10%, rgba(190, 214, 194, .48), transparent 34rem),
                radial-gradient(ellipse at 92% 88%, rgba(231, 215, 184, .38), transparent 30rem),
                #f4f2ed;
        }

        a {
            color: inherit;
        }

        .card {
            width: min(100%, 460px);
            overflow: hidden;
            border: 1px solid rgba(32, 43, 39, .08);
            border-radius: 26px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 24px 70px rgba(42, 54, 47, .12);
        }

        .card-header {
            position: relative;
            min-height: 178px;
            padding: 30px;
            display: flex;
            align-items: flex-end;
            background:
                radial-gradient(circle at 84% 20%, rgba(255, 255, 255, .22) 0 5px, transparent 6px),
                radial-gradient(circle at 76% 36%, rgba(255, 255, 255, .16) 0 3px, transparent 4px),
                linear-gradient(135deg, #244f40, #34765b);
        }

        .monogram {
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .42);
            border-radius: 50%;
            color: #fff;
            background: rgba(255, 255, 255, .14);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 30px;
            letter-spacing: .04em;
        }

        .card-content {
            padding: 28px 30px 30px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--green);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 7vw, 36px);
            font-weight: 500;
            letter-spacing: -.035em;
            line-height: 1.12;
            overflow-wrap: anywhere;
        }

        .role {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        .company {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 17px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 650;
        }

        .company::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #77a78d;
            content: "";
        }

        .actions {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button {
            min-height: 48px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--green);
            border-radius: 12px;
            color: #fff;
            background: var(--green);
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background .18s ease, transform .18s ease;
            cursor: pointer;
        }

        .button:hover {
            background: #1d5943;
            transform: translateY(-1px);
        }

        .button.secondary {
            color: var(--green);
            background: #fff;
        }

        .button.secondary:hover {
            background: #f1f7f2;
        }

        .section-title {
            margin: 29px 0 11px;
            color: #87918b;
            font-size: 10px;
            font-weight: 750;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .details {
            margin: 0;
            border-top: 1px solid var(--line);
        }

        .detail {
            min-height: 52px;
            padding: 12px 0;
            display: grid;
            grid-template-columns: 94px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }

        .detail dt {
            color: var(--muted);
        }

        .detail dd {
            min-width: 0;
            margin: 0;
            color: var(--ink);
            font-weight: 550;
            overflow-wrap: anywhere;
        }

        .detail a {
            color: var(--green);
            text-decoration-color: rgba(36, 107, 82, .35);
            text-underline-offset: 3px;
        }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .social-link {
            min-height: 34px;
            padding: 7px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--green);
            background: #fbfcfa;
            font-size: 12px;
            font-weight: 650;
            text-decoration: none;
        }

        .social-link:hover {
            border-color: #b8d1c1;
            background: #f1f7f2;
        }

        .note {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .footer {
            padding: 0 30px 24px;
            color: #929b95;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 380px) {
            body {
                padding: 14px 10px;
            }

            .card-header {
                min-height: 150px;
                padding: 24px;
            }

            .card-content {
                padding: 24px;
            }

            .detail {
                grid-template-columns: 78px minmax(0, 1fr);
            }

            .footer {
                padding-right: 24px;
                padding-left: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="full-name">
        <div class="card-header">
            <div class="monogram" id="monogram" aria-hidden="true">VC</div>
        </div>

        <section class="card-content">
            <p class="eyebrow">Tarjeta de contacto</p>
            <h1 id="full-name"></h1>
            <p class="role" id="role"></p>
            <p class="company" id="company"></p>

            <div class="actions">
                <a class="button" id="email-button">Enviar correo</a>
                <a class="button secondary" id="phone-button">Llamar</a>
                <button class="button secondary" id="save-contact" type="button" style="grid-column: 1 / -1">Guardar contacto (.vcf)</button>
            </div>

            <h2 class="section-title">Datos de contacto</h2>
            <dl class="details" id="contact-details"></dl>

            <h2 class="section-title">Redes sociales</h2>
            <div class="social-links" id="social-links"></div>
            <p class="note" id="note"></p>
        </section>
        <footer class="footer">Un clic para guardar mis datos y mantenernos en contacto.</footer>
    </main>

    <script>
        // Reemplaza estos ejemplos por tus datos antes de publicar el sitio.
        const profile = {
            firstName: "Tu nombre",
            lastName: "completo",
            company: "Nombre de tu empresa",
            role: "Tu cargo o profesión",
            email: "tu.correo@ejemplo.com",
            phone: "+00 000 000 000",
            website: "https://tusitio.com",
            address: {
                street: "",
                city: "Tu ciudad",
                region: "",
                postalCode: "",
                country: "Tu país"
            },
            note: "Aquí puedes agregar una breve descripción, especialidad o mensaje.",
            socialProfiles: [
                { name: "LinkedIn", type: "linkedin", url: "https://www.linkedin.com/in/tuusuario" },
                { name: "Instagram", type: "instagram", url: "https://www.instagram.com/tuusuario" },
                { name: "X", type: "x", url: "https://x.com/tuusuario" }
            ]
        };

        const fullName = [profile.firstName, profile.lastName].filter(Boolean).join(" ").trim();
        const fullNameElement = document.querySelector("#full-name");
        const detailsElement = document.querySelector("#contact-details");
        const socialLinksElement = document.querySelector("#social-links");

        fullNameElement.textContent = fullName || "Tu nombre completo";
        document.querySelector("#role").textContent = profile.role;
        document.querySelector("#company").textContent = profile.company;
        document.querySelector("#note").textContent = profile.note;
        document.querySelector("#monogram").textContent = [profile.firstName, profile.lastName]
            .filter(Boolean)
            .map((part) => part.trim()[0] || "")
            .join("")
            .slice(0, 2)
            .toUpperCase() || "VC";

        const emailButton = document.querySelector("#email-button");
        emailButton.href = `mailto:${profile.email}`;
        const phoneButton = document.querySelector("#phone-button");
        phoneButton.href = `tel:${profile.phone.replace(/[^\d+]/g, "")}`;

        function addDetail(label, value, href) {
            if (!value) return;

            const row = document.createElement("div");
            row.className = "detail";
            const term = document.createElement("dt");
            term.textContent = label;
            const description = document.createElement("dd");

            if (href) {
                const link = document.createElement("a");
                link.href = href;
                link.textContent = value;
                if (href.startsWith("http")) {
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                }
                description.append(link);
            } else {
                description.textContent = value;
            }

            row.append(term, description);
            detailsElement.append(row);
        }

        addDetail("Correo", profile.email, `mailto:${profile.email}`);
        addDetail("Teléfono", profile.phone, `tel:${profile.phone.replace(/[^\d+]/g, "")}`);
        addDetail("Sitio web", profile.website, profile.website);

        const address = [
            profile.address.street,
            profile.address.city,
            profile.address.region,
            profile.address.postalCode,
            profile.address.country
        ].filter(Boolean).join(", ");
        addDetail("Ubicación", address);

        profile.socialProfiles.filter((social) => social.url).forEach((social) => {
            const link = document.createElement("a");
            link.className = "social-link";
            link.href = social.url;
            link.textContent = social.name;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            socialLinksElement.append(link);
        });

        function escapeVCard(value) {
            return String(value || "")
                .replace(/\\/g, "\\\\")
                .replace(/\r?\n/g, "\\n")
                .replace(/,/g, "\\,")
                .replace(/;/g, "\\;");
        }

        document.querySelector("#save-contact").addEventListener("click", () => {
            const lines = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `N:${escapeVCard(profile.lastName)};${escapeVCard(profile.firstName)};;;`,
                `FN:${escapeVCard(fullName)}`,
                `ORG:${escapeVCard(profile.company)}`,
                `TITLE:${escapeVCard(profile.role)}`,
                `TEL;TYPE=CELL:${escapeVCard(profile.phone)}`,
                `EMAIL;TYPE=INTERNET:${escapeVCard(profile.email)}`
            ];

            if (profile.website) lines.push(`URL:${escapeVCard(profile.website)}`);
            if (address) {
                lines.push(`ADR;TYPE=WORK:;;${escapeVCard(profile.address.street)};${escapeVCard(profile.address.city)};${escapeVCard(profile.address.region)};${escapeVCard(profile.address.postalCode)};${escapeVCard(profile.address.country)}`);
            }
            profile.socialProfiles.filter((social) => social.url).forEach((social) => {
                lines.push(`X-SOCIALPROFILE;TYPE=${escapeVCard(social.type)}:${escapeVCard(social.url)}`);
            });
            if (profile.note) lines.push(`NOTE:${escapeVCard(profile.note)}`);
            lines.push("END:VCARD");

            const file = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
            const downloadUrl = URL.createObjectURL(file);
            const downloadLink = document.createElement("a");
            downloadLink.href = downloadUrl;
            downloadLink.download = `${fullName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "contacto"}.vcf`;
            downloadLink.click();
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        });
    </script>
</body>
</html>
